[profile.default]
src = "contracts"
test = "contracts/tests"
out = "out"
libs = ["node_modules"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "london"
remappings = ["forge-std/=node_modules/forge-std/src/"]
fs_permissions = [
  { access = "read", path = "./ignition/modules/BufferPctAndCleanMocV1/parameters" },
  { access = "read", path = "./ignition/modules/SetMocSwapperPath/parameters" },
]
